      <animate attributeName="r" values="30;66" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="580" y="88" width="40" height="70" rx="9" fill="#26112B" stroke="#8FD6A4" stroke-width="3"/>
