    <text x="60" y="690" font-weight="700" fill="#FFD166">Spark payouts</text>
    <text x="60" y="711" fill="#C9A3B7">only when paying</text>
    <text x="60" y="742" font-weight="700" fill="#C9A3B7">QVAC registry</text>
    <text x="60" y="763" fill="#C9A3B7">first model download</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C9A3B7">
    <path d="M600 684 H660" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <text x="676" y="689">encrypted HyperDHT pipe · model layers and tokens</text>
    <path d="M600 716 H660" stroke="#8FD6A4" stroke-width="3" stroke-dasharray="8 9" stroke-linecap="round"/>
    <text x="676" y="721">Hyperswarm discovery · secret topic from the invite code</text>
    <path d="M600 748 H660" stroke="#FFD166" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
    <text x="676" y="753">leaves the hotspot only to pay, never for answers</text>
  </g>

  <path d="M40 790 H1160" stroke="#4A2A4E" stroke-width="1.5"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="58" cy="836" r="16" fill="#8FD6A4"/><text x="58" y="842" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">1</text>
    <text x="86" y="832" font-size="18" font-weight="800" fill="#FFF1E8">Join</text>
    <text x="134" y="832" font-family="Consolas, Menlo, monospace" font-size="14" fill="#F08AB0">Pears · Hyperswarm</text>
    <text x="86" y="856" font-size="14" fill="#C9A3B7">Helpers find the coordinator with the invite code.</text>

    <circle cx="438" cy="836" r="16" fill="#FFD166"/><text x="438" y="842" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">2</text>
    <text x="466" y="832" font-size="18" font-weight="800" fill="#FFF1E8">Approve</text>
    <text x="548" y="832" font-family="Consolas, Menlo, monospace" font-size="14" fill="#FF8A3D">QVAC RPC · HyperDHT pipe</text>
    <text x="466" y="856" font-size="14" fill="#C9A3B7">The teacher approves; real free memory is read.</text>

    <circle cx="818" cy="836" r="16" fill="#FFD166"/><text x="818" y="842" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">3</text>
    <text x="846" y="832" font-size="18" font-weight="800" fill="#FFF1E8">Split and load</text>
    <text x="846" y="856" font-family="Consolas, Menlo, monospace" font-size="14" fill="#FF8A3D">QVAC loadModel · tensor-split</text>
    <text x="846" y="876" font-size="14" fill="#C9A3B7">Each laptop gets layers for its free memory.</text>

    <circle cx="58" cy="916" r="16" fill="#FF8A3D"/><text x="58" y="922" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">4</text>
    <text x="86" y="912" font-size="18" font-weight="800" fill="#FFF1E8">Ask</text>
    <text x="130" y="912" font-family="Consolas, Menlo, monospace" font-size="14" fill="#FF8A3D">QVAC completion · stream</text>
    <text x="86" y="936" font-size="14" fill="#C9A3B7">Every token passes through every laptop's layers.</text>

    <circle cx="438" cy="916" r="16" fill="#D9558A"/><text x="438" y="922" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">5</text>
    <text x="466" y="912" font-size="18" font-weight="800" fill="#FFF1E8">Record</text>
    <text x="536" y="912" font-family="Consolas, Menlo, monospace" font-size="14" fill="#F08AB0">Pears · Hypercore</text>
    <text x="466" y="936" font-size="14" fill="#C9A3B7">Each helper's work is signed into the ledger.</text>

    <circle cx="818" cy="916" r="16" fill="#FFD166"/><text x="818" y="922" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">6</text>
    <text x="846" y="912" font-size="18" font-weight="800" fill="#FFF1E8">Pay</text>
    <text x="888" y="912" font-family="Consolas, Menlo, monospace" font-size="14" fill="#FFD166">WDK · Spark</text>
    <text x="846" y="936" font-size="14" fill="#C9A3B7">Helpers get sats once the internet is back.</text>
  </g>
</svg>
