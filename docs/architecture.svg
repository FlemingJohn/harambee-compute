    <text x="354" y="370" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#FF8A3D">10 layers</text>
    <path d="M66 408H434L420 424H80Z" fill="#321838" stroke="#FF8A3D" stroke-width="2.5"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
