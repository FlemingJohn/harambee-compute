<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-label="Harambee Compute architecture. A teacher laptop and two helper laptops on one phone hotspot with the internet off. Helpers find the coordinator with Hyperswarm, model layers and tokens travel through encrypted HyperDHT pipes, work is written to a Hypercore ledger, and helpers are paid with a WDK Spark wallet when the internet is back.">
  <defs>
    <path id="pipe-top" d="M410 280 C 560 280 640 220 800 220"/>
    <path id="pipe-bottom" d="M410 330 C 560 330 640 470 800 470"/>
    <path id="swarm-line" d="M800 180 C 660 196 480 190 380 206"/>
  </defs>
  <rect width="1200" height="980" rx="24" fill="#1A0B1E"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="48" font-size="26" font-weight="800" fill="#FFF1E8">How Harambee Compute works</text>
    <text x="1160" y="48" text-anchor="end" font-size="17" fill="#C9A3B7">one hotspot · one model · everyone who helps gets paid</text>
  </g>

  <rect x="24" y="72" width="1152" height="572" rx="28" fill="#1F0D23" stroke="#3F6B4F" stroke-width="2.5" stroke-dasharray="10 10"/>
  <g transform="translate(64 104)" fill="none" stroke="#8FD6A4" stroke-width="2.6" stroke-linecap="round">
