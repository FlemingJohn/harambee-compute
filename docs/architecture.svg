    <path d="M-9 -3a13 13 0 0 1 18 0"/><path d="M-17 -11a25 25 0 0 1 34 0"/>
  </g>
  <text x="92" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#8FD6A4">Phone hotspot or router · internet OFF</text>

