    <circle cx="276" cy="562" r="5" fill="#F08AB0"/><text x="290" y="567" fill="#FFF1E8">HyperDHT bootstrap</text>
    <rect x="62" y="586" width="186" height="32" rx="16" fill="#26112B" stroke="#C9A3B7" stroke-width="1.5"/>
    <circle cx="82" cy="602" r="5" fill="#C9A3B7"/><text x="96" y="607" fill="#FFF1E8">Screens · 127.0.0.1</text>
    <rect x="256" y="586" width="186" height="32" rx="16" fill="#46331F" stroke="#FFD166" stroke-width="1.5"/>
    <circle cx="276" cy="602" r="5" fill="#FFD166"/><text x="290" y="607" fill="#FFD166">WDK Spark wallet</text>
  </g>

  <g>
    <rect x="800" y="140" width="260" height="160" rx="12" fill="#26112B" stroke="#FFD166" stroke-width="3"/>
