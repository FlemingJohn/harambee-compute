    <circle cx="82" cy="522" r="5" fill="#FF8A3D"/><text x="96" y="527" fill="#FFF1E8">QVAC client</text>
    <rect x="256" y="506" width="186" height="32" rx="16" fill="#26112B" stroke="#F08AB0" stroke-width="1.5"/>
    <circle cx="276" cy="522" r="5" fill="#F08AB0"/><text x="290" y="527" fill="#FFF1E8">Hypercore ledger</text>
    <rect x="62" y="546" width="186" height="32" rx="16" fill="#26112B" stroke="#FF8A3D" stroke-width="1.5"/>
