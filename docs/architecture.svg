    <rect x="112" y="350" width="190" height="26" rx="8" fill="#321838" stroke="#5C3760"/>
    <g fill="#FF8A3D">
      <rect x="320" y="234" width="68" height="8" rx="2"/><rect x="320" y="246" width="68" height="8" rx="2"/>
      <rect x="320" y="258" width="68" height="8" rx="2"/><rect x="320" y="270" width="68" height="8" rx="2"/>
      <rect x="320" y="282" width="68" height="8" rx="2"/><rect x="320" y="294" width="68" height="8" rx="2"/>
      <rect x="320" y="306" width="68" height="8" rx="2"/><rect x="320" y="318" width="68" height="8" rx="2"/>
      <rect x="320" y="330" width="68" height="8" rx="2"/><rect x="320" y="342" width="68" height="8" rx="2"/>
