  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="930" y="352" font-size="22" font-weight="800" fill="#FFF1E8">Lab PC · helper</text>
    <text x="930" y="376" font-size="15" fill="#C9A3B7">holds 9 layers · own wallet</text>
    <text x="930" y="604" font-size="22" font-weight="800" fill="#FFF1E8">Friend's laptop · helper</text>
    <text x="930" y="628" font-size="15" fill="#C9A3B7">holds 9 layers · own wallet</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="560" cy="190" r="16" fill="#8FD6A4"/>
    <text x="560" y="196" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">1</text>
    <text x="500" y="172" text-anchor="end" font-size="15" font-weight="700" fill="#8FD6A4">join with the invite code</text>
    <circle cx="720" cy="210" r="16" fill="#FFD166"/>
    <text x="720" y="216" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">2</text>
    <text x="664" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#FFD166">approve · read free memory</text>
    <circle cx="720" cy="436" r="16" fill="#FFD166"/>
    <text x="720" y="442" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">3</text>
    <text x="650" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#FFD166">layers in · tokens through</text>
    <circle cx="106" cy="176" r="16" fill="#FF8A3D"/>
    <text x="106" y="182" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">4</text>
    <text x="130" y="182" font-size="15" font-weight="700" fill="#FF8A3D">a student asks</text>
    <circle cx="452" cy="522" r="16" fill="#D9558A"/>
    <text x="452" y="528" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">5</text>
    <circle cx="452" cy="602" r="16" fill="#FFD166"/>
    <text x="452" y="608" text-anchor="middle" font-size="17" font-weight="800" fill="#1A0B1E">6</text>
  </g>

