    <use href="#pipe-top" xlink:href="#pipe-top" stroke="#FFD166" stroke-width="18" opacity="0.14"/>
    <use href="#pipe-bottom" xlink:href="#pipe-bottom" stroke="#FFD166" stroke-width="18" opacity="0.14"/>
    <use href="#pipe-top" xlink:href="#pipe-top" stroke="#FFD166" stroke-width="4"/>
    <use href="#pipe-bottom" xlink:href="#pipe-bottom" stroke="#FFD166" stroke-width="4"/>
  </g>

  <circle r="7" fill="#8FD6A4">
    <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#swarm-line" xlink:href="#swarm-line"/></animateMotion>
  </circle>
  <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#FFD166" stroke="#1A0B1E" stroke-width="2">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#pipe-top" xlink:href="#pipe-top"/></animateMotion>
  </rect>
  <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#D9558A" stroke="#1A0B1E" stroke-width="2">
    <animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#pipe-bottom" xlink:href="#pipe-bottom"/></animateMotion>
  </rect>
  <circle r="7" fill="#FFF1E8" stroke="#FFD166" stroke-width="2">
    <animateMotion dur="2.2s" begin="1.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pipe-top" xlink:href="#pipe-top"/></animateMotion>
  </circle>

